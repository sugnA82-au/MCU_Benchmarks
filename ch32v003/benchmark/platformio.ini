; CH32V003 benchmark. Two images, because 16 KB of flash cannot hold CoreMark
; and the rest of the suite and still leave room for the flash sweep:
;   suite       CPU / SRAM / flash read / flash sweep         (default)
;   coremark    CoreMark, 1200-byte profile dataset
;   conformant  CoreMark, 2000-byte dataset: links, cannot run (size evidence)
[platformio]
default_envs = suite
src_dir = .

[env]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git#8cf3b51c0ee537756a04c28336f1466e03424020
board = ch32v003f4p6_evt_r0
framework = ch32v003fun
upload_protocol = wlink
build_unflags = -Os
extra_scripts = post:build_options.py
build_flags =
    -O2
    -fno-builtin
    -fstack-usage
    -I .
    -I coremark
platform_packages =
    framework-ch32v003fun @ https://github.com/Community-PIO-CH32V/ch32v003fun.git#72957fb

[env:suite]
build_src_filter = +<main.c> +<platform.c>

[env:coremark]
build_src_filter = +<coremark_main.c> +<platform.c> +<coremark/*.c>
build_flags = ${env.build_flags} -DITERATIONS=0 -DPROFILE_RUN=1 -DTOTAL_DATA_SIZE=1200

[env:conformant]
build_src_filter = +<coremark_main.c> +<platform.c> +<coremark/*.c>
build_flags = ${env.build_flags} -DITERATIONS=0 -DPERFORMANCE_RUN=1 -DTOTAL_DATA_SIZE=2000
